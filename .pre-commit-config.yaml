repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^web/vendor/
      - id: end-of-file-fixer
        exclude: ^web/vendor/
      - id: check-yaml
      - id: check-json
        exclude: ^web/vendor/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
