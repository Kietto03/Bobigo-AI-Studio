# PostgreSQL for Bobigo AI Studio.
# Only the database runs in Docker — the FastAPI backend stays on the host so it
# can reach the local llama-server (Metal GPU) and MCP servers.
#   docker compose up -d db      # start
#   docker compose stop db       # stop (data kept in the named volume)
services:
  db:
    image: postgres:16-alpine
    container_name: bobigo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bobigo
      POSTGRES_PASSWORD: bobigo
      POSTGRES_DB: bobigo
    ports:
      # Bind to loopback only — not reachable from the LAN.
      # Host port 5433 (5432 is often taken by another local Postgres).
      - "127.0.0.1:5433:5432"
    volumes:
      - bobigo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobigo -d bobigo"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------
  # Optional full-stack mode (docker compose --profile full up -d)
  # Runs the FastAPI app in a container for non-macOS hosts; llama-server
  # stays on the host (Metal/CUDA) and is reached via host.docker.internal.
  #   LLM_BASE_URL=http://192.168.1.10:11434 docker compose --profile full up -d
  # ------------------------------------------------------------------
  app:
    profiles: ["full"]
    build: .
    container_name: bobigo-app
    restart: unless-stopped
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://bobigo:bobigo@db:5432/bobigo
      CONTEXT_WINDOW: ${CONTEXT_WINDOW:-8192}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  bobigo_pgdata:
